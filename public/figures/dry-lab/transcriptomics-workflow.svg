<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Transcriptomics workflow from light-acclimated samples to pathway interpretation</title>
  <desc id="desc">Three light treatments with three biological replicates feed two linked analysis tracks: Trinity transcript sequences are annotated with DIAMOND blastx, and read counts are compared with DESeq 1.10.1. The results are joined by transcript identifier, interpreted by carotenoid pathway step, and the LCYB expression response is passed to the mathematical model.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1 1L10 6L1 11" fill="none" stroke="#6b8779" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="570" rx="24" fill="#fbf8ef"/>
  <path d="M42 76H1158" stroke="#dfe3d8" stroke-width="2"/>
  <text x="54" y="48" fill="#55764d" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">FROM CULTURE DESIGN TO A TESTABLE PATHWAY QUESTION</text>

  <g font-family="Arial,sans-serif">
    <rect x="54" y="105" width="1092" height="105" rx="16" fill="#e8eee2" stroke="#c7d3c4" stroke-width="2"/>
    <text x="78" y="137" fill="#577267" font-size="13" font-weight="700" letter-spacing="2">GSE120965 · 168 h LIGHT ACCLIMATION</text>
    <g text-anchor="middle">
      <rect x="78" y="151" width="225" height="42" rx="11" fill="#fffdf7"/>
      <text x="190" y="178" fill="#123b32" font-size="17" font-weight="700">150 PPFD <tspan fill="#73867d" font-size="14">· 3 replicates</tspan></text>
      <rect x="322" y="151" width="225" height="42" rx="11" fill="#fffdf7"/>
      <text x="434" y="178" fill="#123b32" font-size="17" font-weight="700">600 PPFD <tspan fill="#73867d" font-size="14">· 3 replicates</tspan></text>
      <rect x="566" y="151" width="225" height="42" rx="11" fill="#fffdf7"/>
      <text x="678" y="178" fill="#123b32" font-size="17" font-weight="700">1500 PPFD <tspan fill="#73867d" font-size="14">· 3 replicates</tspan></text>
    </g>

    <path d="M190 210V241H328V257M678 210V241H328M434 210V241H838V257M678 241H838" fill="none" stroke="#9daf9f" stroke-width="3"/>
    <circle cx="328" cy="241" r="5" fill="#86a83a"/><circle cx="838" cy="241" r="5" fill="#66bdc5"/>

    <rect x="54" y="257" width="530" height="186" rx="17" fill="#eef3e8" stroke="#a9bb9d" stroke-width="2"/>
    <rect x="54" y="257" width="530" height="45" rx="16" fill="#dce8d2"/>
    <path d="M54 286V302H584V286" fill="#dce8d2"/>
    <text x="78" y="286" fill="#315d42" font-size="14" font-weight="700" letter-spacing="1.5">SEQUENCE TRACK · TRINITY FASTA</text>
    <rect x="78" y="325" width="137" height="78" rx="12" fill="#fffdf7" stroke="#d9e1d2"/>
    <text x="146" y="357" fill="#123b32" font-size="16" font-weight="700" text-anchor="middle">Transcript</text>
    <text x="146" y="380" fill="#64776d" font-size="13" text-anchor="middle">sequences</text>
    <path d="M220 364H250" stroke="#6b8779" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="261" y="325" width="137" height="78" rx="12" fill="#fffdf7" stroke="#d9e1d2"/>
    <text x="329" y="357" fill="#123b32" font-size="16" font-weight="700" text-anchor="middle">DIAMOND</text>
    <text x="329" y="380" fill="#64776d" font-size="13" text-anchor="middle">blastx homology</text>
    <path d="M403 364H433" stroke="#6b8779" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="444" y="325" width="116" height="78" rx="12" fill="#e2f0ac" stroke="#b6cc7c"/>
    <text x="502" y="357" fill="#123b32" font-size="15" font-weight="700" text-anchor="middle">Enzyme</text>
    <text x="502" y="380" fill="#496539" font-size="13" text-anchor="middle">annotation</text>

    <rect x="616" y="257" width="530" height="186" rx="17" fill="#eaf3f3" stroke="#9ec9c8" stroke-width="2"/>
    <rect x="616" y="257" width="530" height="45" rx="16" fill="#d8eeee"/>
    <path d="M616 286V302H1146V286" fill="#d8eeee"/>
    <text x="640" y="286" fill="#376c70" font-size="14" font-weight="700" letter-spacing="1.5">EXPRESSION TRACK · READCOUNT MATRIX</text>
    <rect x="640" y="325" width="137" height="78" rx="12" fill="#fffdf7" stroke="#d4e3e1"/>
    <text x="708" y="357" fill="#123b32" font-size="16" font-weight="700" text-anchor="middle">9 samples</text>
    <text x="708" y="380" fill="#64776d" font-size="13" text-anchor="middle">count matrix</text>
    <path d="M782 364H812" stroke="#6b8779" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="823" y="325" width="137" height="78" rx="12" fill="#fffdf7" stroke="#d4e3e1"/>
    <text x="891" y="357" fill="#123b32" font-size="16" font-weight="700" text-anchor="middle">DESeq 1.10.1</text>
    <text x="891" y="380" fill="#64776d" font-size="13" text-anchor="middle">size factors + test</text>
    <path d="M968 364H998" stroke="#6b8779" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1009" y="325" width="113" height="78" rx="12" fill="#fffdf7" stroke="#d4e3e1"/>
    <text x="1065" y="357" fill="#123b32" font-size="15" font-weight="700" text-anchor="middle">3 pairwise</text>
    <text x="1065" y="380" fill="#64776d" font-size="13" text-anchor="middle">light contrasts</text>

    <path d="M502 443V464H600M1065 443V464H600V482" fill="none" stroke="#9daf9f" stroke-width="3"/>
    <rect x="354" y="480" width="492" height="62" rx="15" fill="#123b32"/>
    <text x="600" y="507" fill="#d7f46f" font-size="14" font-weight="700" letter-spacing="1.4" text-anchor="middle">JOIN BY TRINITY TRANSCRIPT ID</text>
    <text x="600" y="529" fill="#fffdf7" font-size="14" text-anchor="middle">Read the response by enzyme step → carry LCYB expression into the model</text>
  </g>
</svg>
