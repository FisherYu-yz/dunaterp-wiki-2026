<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Selected carotenoid transcript responses across light contrasts</title>
  <desc id="desc">A diverging bar chart shows six selected transcript and contrast pairs from the DESeq analysis. Positive log2 fold change means higher expression in the first-named condition; negative means higher expression in the second. All six listed q values are below 0.05.</desc>
  <rect width="1200" height="590" rx="24" fill="#fbf8ef"/>
  <path d="M42 77H1158" stroke="#dfe3d8" stroke-width="2"/>
  <text x="54" y="48" fill="#55764d" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">SELECTED CAROTENOID TRANSCRIPT RESPONSES</text>
  <g font-family="Arial,sans-serif">
    <text x="55" y="111" fill="#667a70" font-size="14" font-weight="700">ENZYME · CONTRAST</text>
    <text x="630" y="111" fill="#667a70" font-size="14" font-weight="700" text-anchor="middle">log₂ FOLD CHANGE</text>
    <text x="1095" y="111" fill="#667a70" font-size="14" font-weight="700" text-anchor="end">q VALUE</text>
    <path d="M400 132H880" stroke="#c9d2c7" stroke-width="2"/>
    <g fill="#74857d" font-size="12" text-anchor="middle">
      <text x="400" y="128">−1</text><text x="480" y="128">0</text><text x="560" y="128">1</text><text x="640" y="128">2</text><text x="720" y="128">3</text><text x="800" y="128">4</text><text x="880" y="128">5</text>
    </g>
    <path d="M480 137V481" stroke="#83958b" stroke-width="2" stroke-dasharray="5 6"/>

    <g fill="#123b32" font-size="16">
      <text x="55" y="174" font-weight="700">CRTISO</text><text x="55" y="194" fill="#667a70" font-size="13">1500 vs 600</text>
      <text x="55" y="230" font-weight="700">LCYB</text><text x="55" y="250" fill="#667a70" font-size="13">600 vs 150</text>
      <text x="55" y="286" font-weight="700">LCYB</text><text x="55" y="306" fill="#667a70" font-size="13">1500 vs 600</text>
      <text x="55" y="342" font-weight="700">LCYE</text><text x="55" y="362" fill="#667a70" font-size="13">1500 vs 150</text>
      <text x="55" y="398" font-weight="700">PDS</text><text x="55" y="418" fill="#667a70" font-size="13">1500 vs 150</text>
      <text x="55" y="454" font-weight="700">ZEP</text><text x="55" y="474" fill="#667a70" font-size="13">1500 vs 150</text>
    </g>
    <g stroke="#e5e7dc" stroke-width="1"><path d="M55 209H1145"/><path d="M55 265H1145"/><path d="M55 321H1145"/><path d="M55 377H1145"/><path d="M55 433H1145"/></g>

    <rect x="480" y="153" width="376" height="24" rx="12" fill="#719b32"/><text x="866" y="171" fill="#426327" font-size="14" font-weight="700">+4.70</text>
    <rect x="480" y="209" width="46" height="24" rx="12" fill="#719b32"/><text x="536" y="227" fill="#426327" font-size="14" font-weight="700">+0.58</text>
    <rect x="455" y="265" width="25" height="24" rx="12" fill="#c37b36"/><text x="445" y="283" fill="#985e2a" font-size="14" font-weight="700" text-anchor="end">−0.31</text>
    <rect x="480" y="321" width="46" height="24" rx="12" fill="#719b32"/><text x="536" y="339" fill="#426327" font-size="14" font-weight="700">+0.58</text>
    <rect x="434" y="377" width="46" height="24" rx="12" fill="#c37b36"/><text x="424" y="395" fill="#985e2a" font-size="14" font-weight="700" text-anchor="end">−0.58</text>
    <rect x="418" y="433" width="62" height="24" rx="12" fill="#c37b36"/><text x="408" y="451" fill="#985e2a" font-size="14" font-weight="700" text-anchor="end">−0.78</text>

    <g fill="#415e53" font-size="14" text-anchor="end">
      <text x="1095" y="171">2.8 × 10⁻¹¹¹</text><text x="1095" y="227">1.3 × 10⁻¹³</text><text x="1095" y="283">1.1 × 10⁻⁴</text><text x="1095" y="339">1.4 × 10⁻⁷</text><text x="1095" y="395">4.3 × 10⁻¹²</text><text x="1095" y="451">3.5 × 10⁻¹⁵</text>
    </g>

    <rect x="55" y="505" width="1090" height="52" rx="13" fill="#e9eee2"/>
    <text x="78" y="527" fill="#315d42" font-size="13" font-weight="700">HOW TO READ</text>
    <text x="78" y="546" fill="#60756d" font-size="13">Each row is one transcript–contrast result. Positive values indicate higher abundance in the first-named light condition; all displayed q values are &lt; 0.05.</text>
  </g>
</svg>
